name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARGUS_CORE_REPO: Max-Gabriel-Susman/argus_core
  ARGUS_CORE_REF: main
  # Path to the header inside argus_core
  UPSTREAM_WIRE: include/argus_core/argus_wire.h
  VENDORED_WIRE: safety_controller/src/argus_wire.h

jobs:
  vendor-drift:
    name: vendored argus_wire.h matches argus_core@main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream argus_core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARGUS_CORE_REPO }}
          ref: ${{ env.ARGUS_CORE_REF }}
          path: _upstream
          # If argus_core is private, add:
          # token: ${{ secrets.ARGUS_CORE_TOKEN }}

      - name: Diff vendored copy against upstream
        run: |
          up="_upstream/${UPSTREAM_WIRE}"
          if [ ! -f "$up" ]; then
            echo "::error::upstream header not at $up — files present:"
            find _upstream -name 'argus_wire.h'
            exit 1
          fi
          if ! diff -u "$up" "$VENDORED_WIRE"; then
            echo "::error::vendored wire header has drifted from argus_core@${ARGUS_CORE_REF}"
            echo "re-vendor with: cp $up $VENDORED_WIRE"
            exit 1
          fi
          echo "vendored header is in sync ($(sha256sum "$VENDORED_WIRE" | cut -c1-16))"

  wire-abi:
    name: wire ABI (host + cortex-a9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Host build (x86-64) — static asserts plus runtime CRC vectors
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Wpedantic \
              -Isafety_controller/src -Ici/stubs \
              ci/wire_selftest.c -o wire_selftest_host
          ./wire_selftest_host

      - name: Target build (cortex-a9) — static asserts only
        run: |
          arm-none-eabi-gcc -std=c11 -Wall -Wextra -Werror -Wpedantic \
              -mcpu=cortex-a9 -mfpu=vfpv3 -mfloat-abi=hard \
              -Isafety_controller/src -Ici/stubs \
              -c ci/wire_selftest.c -o wire_selftest_a9.o
          arm-none-eabi-size wire_selftest_a9.o

  firmware-build:
    name: off-target compile
    runs-on: ubuntu-24.04
    # Flip to false once ci/compile_allowlist.txt is populated and green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi

      - name: Compile allowlisted translation units
        run: |
          if [ ! -f ci/compile_allowlist.txt ]; then
            echo "::warning::ci/compile_allowlist.txt absent — run ci/probe_sources.sh locally"
            exit 0
          fi
          fails=0
          while read -r f; do
            case "$f" in ''|'#'*) continue ;; esac
            printf 'CC  %s\n' "$f"
            arm-none-eabi-gcc -std=c11 -Os \
              -mcpu=cortex-a9 -mfpu=vfpv3 -mfloat-abi=hard -marm \
              -Ici/stubs -Isrc \
              -Isrc/lwip/src/include \
              -Isrc/lwip/contrib/ports/xilinx/include \
              -c "$f" -o /dev/null || { echo "::error file=$f::compile failed"; fails=$((fails+1)); }
          done < ci/compile_allowlist.txt
          echo "$fails failure(s)"
          [ "$fails" -eq 0 ]

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/hygiene.sh

  docs:
    name: Doxygen reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen graphviz

      - name: Build the reference with warnings as errors
        run: ( cat Doxyfile; echo "WARN_AS_ERROR = FAIL_ON_WARNINGS" ) | doxygen -
