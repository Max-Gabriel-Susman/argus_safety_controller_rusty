name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARGUS_CORE_REPO: Max-Gabriel-Susman/argus_core
  ARGUS_CORE_REF: main
  # Path to the header inside argus_core
  UPSTREAM_WIRE: include/argus_core/argus_wire.h
  VENDORED_WIRE: safety_controller/src/argus_wire.h

jobs:
  vendor-drift:
    name: vendored argus_wire.h matches argus_core@main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream argus_core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARGUS_CORE_REPO }}
          ref: ${{ env.ARGUS_CORE_REF }}
          path: _upstream
          # If argus_core is private, add:
          # token: ${{ secrets.ARGUS_CORE_TOKEN }}

      - name: Diff vendored copy against upstream
        run: |
          up="_upstream/${UPSTREAM_WIRE}"
          if [ ! -f "$up" ]; then
            echo "::error::upstream header not at $up; files present:"
            find _upstream -name 'argus_wire.h'
            exit 1
          fi
          if ! diff -u "$up" "$VENDORED_WIRE"; then
            echo "::error::vendored wire header has drifted from argus_core@${ARGUS_CORE_REF}"
            echo "re-vendor with: cp $up $VENDORED_WIRE"
            exit 1
          fi
          echo "vendored header is in sync ($(sha256sum "$VENDORED_WIRE" | cut -c1-16))"

  wire-abi:
    name: wire ABI (host + cortex-a9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Host build (x86-64), static asserts plus runtime CRC vectors
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Wpedantic \
              -Isafety_controller/src -Ici/stubs \
              ci/wire_selftest.c -o wire_selftest_host
          ./wire_selftest_host

      - name: Target build (cortex-a9), static asserts only
        run: |
          arm-none-eabi-gcc -std=c11 -Wall -Wextra -Werror -Wpedantic \
              -mcpu=cortex-a9 -mfpu=vfpv3 -mfloat-abi=hard \
              -Isafety_controller/src -Ici/stubs \
              -c ci/wire_selftest.c -o wire_selftest_a9.o
          arm-none-eabi-size wire_selftest_a9.o

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/hygiene.sh

  rust:
    name: rust workspace (host + cortex-a9)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      TARGET: armv7a-none-eabihf
      # gen-wire.sh refuses any other version: bindgen's wording changes
      # between releases, and --check would fail for that alone.
      BINDGEN_VERSION: 0.73.2
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the one place the toolchain is named. With no
      # argument, rustup installs what that file asks for: the channel, the
      # clippy and rustfmt components and the A9 target.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # Keyed on the lock file and the toolchain, so a dependency or compiler
      # change starts a fresh cache rather than reusing stale artifacts.
      - name: Cache cargo downloads and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (host, every target)
        run: cargo clippy --locked --all-targets -- -D warnings

      # Includes argus-difftest, which compiles the C replay client and
      # frame packing with the runner's gcc and runs them beside the Rust.
      - name: Test
        run: cargo test --locked

      # The no_std crates must also build for the Cortex-A9, where the
      # firmware uses them; a host build would not catch a stray std use.
      - name: Clippy (cortex-a9, no_std crates)
        run: >-
          cargo clippy --locked --target "$TARGET"
          -p argus-wire -p argus-replay -p argus-fw-core -- -D warnings

      - name: Build (cortex-a9, no_std crates)
        run: >-
          cargo build --locked --release --target "$TARGET"
          -p argus-wire -p argus-replay -p argus-fw-core

      - name: Rustdoc
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # bindgen loads libclang at run time; libclang-dev also brings clang's
      # own headers (stddef.h and friends), which argus_wire.h needs.
      - name: Install libclang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      # Building bindgen-cli takes minutes, so the binary is cached on its
      # own, keyed on the version alone.
      - name: Cache bindgen-cli
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-cli-${{ runner.os }}-${{ env.BINDGEN_VERSION }}

      - name: Install bindgen-cli
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install bindgen-cli --locked --version "$BINDGEN_VERSION"

      - name: generated.rs matches argus_wire.h
        run: bash tools/gen-wire.sh --check
