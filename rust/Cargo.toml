# This is a virtual manifest: it defines a workspace but is not itself a
# crate, so there is no [package] table and nothing builds at this level.
# Every crate under rust/ joins as a member and shares one Cargo.lock, one
# target/ directory, and the profiles below.
#
#
# The firmware is moving to Rust whole: everything that runs on the
# Cortex-A9 becomes Rust on Embassy, with smoltcp in place of lwIP. The C
# application in safety_controller/ is the specification until the Rust
# firmware matches it on the board. The library crates are no_std and
# host-tested; only the firmware binary is built for the A9, with an
# explicit --target (see .cargo/config.toml).
[workspace]
resolver = "3"

members = ["argus-wire"]

# What a bare `cargo build` or `cargo test` in rust/ acts on: every crate that
# builds and tests on the host. The firmware binary, once it exists, stays
# out of this list because it only builds for the A9.
default-members = ["argus-wire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false #private repo; makes `cargo publish` refuse to run

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = true

[profile.dev]
panic = "abort"
