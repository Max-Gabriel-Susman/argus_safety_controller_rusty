# This is a virtual manifest: it defines a workspace but is not itself a
# crate, so there is no [package] table and nothing builds at this level.
# Every crate under rust/ joins as a member and shares one Cargo.lock, one
# target/ directory, and the profiles below.
#
#
# The firmware is Rust whole: everything that runs on the Cortex-A9 is
# Rust on Embassy, with smoltcp in place of lwIP. It replaced a C
# application (the Vitis standalone BSP and lwIP); of that, only the wire
# contract and the replay client header remain, in safety_controller/src,
# as gen-wire.sh's input and argus-difftest's oracle. The library crates
# are no_std and host-tested; only the firmware binary is built for the
# A9, with an explicit --target (see .cargo/config.toml).
[workspace]
resolver = "3"

members = ["argus-wire", "argus-replay", "argus-fw-core", "argus-difftest", "argus-fw"]

# What a bare `cargo build` or `cargo test` in rust/ acts on: every crate that
# builds and tests on the host. The firmware binary, argus-fw, stays out of
# this list because it only builds for the A9 (see tools/build-fw.sh).
default-members = ["argus-wire", "argus-replay", "argus-fw-core", "argus-difftest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false #private repo; makes `cargo publish` refuse to run

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Every public item carries rustdoc. The gate builds with -D warnings, so a
# public item added without a doc comment fails it.
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = true

[profile.dev]
panic = "abort"

# The differential tests run millions of steps through both replay clients.
# Unoptimized, a run takes over half a minute; optimized, a few seconds. The
# clients under test are optimized with them, the C shim included (cc takes
# its -O level from this profile), so what is compared is still what runs.
[profile.dev.package.argus-difftest]
opt-level = 2
[profile.dev.package.argus-replay]
opt-level = 2
[profile.dev.package.argus-wire]
opt-level = 2
