# argus-wire: the wire contract between the board and the host, in Rust.
#
# Every key ending in .workspace is inherited from [workspace.package] in
# ../Cargo.toml, so the version, edition, compiler floor and license are
# written once for the whole workspace.

[package]
name = "argus-wire" # code imports it as argus_wire: Rust turns - into _
description = "Argus wire contract: CRC-16, packet layouts, packet validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Opts this crate into [workspace.lints]. Without it, the deny list in
# ../Cargo.toml does not apply here.
[lints]
workspace = true

[dependencies]
# Safe conversions between bytes and the packed wire structs. The derives on
# the generated structs prove at compile time that the structs have no
# padding and that every byte pattern is a valid value, so viewing a received
# datagram as a header needs no unsafe code. Works under no_std.
zerocopy = { version = "0.8", features = ["derive"] }
